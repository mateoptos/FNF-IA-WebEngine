let W,H,AC,M,NB,GL,custBuf=[],sel=1,state='menu',S,N=[],P=[],Q=[],T0=0,pos=0,srcs=[],si=0,li=0,tot=0,endMs=0,lo=0,oi=0,dlo=0,sc=0,cb=0,mx=0,hp=1,ht=[0,0,0,0,0],rate=0,rT=0,pP=0,pT=0,oP=0,oT=0,tm=0,msg='';

/* ---------- charts ---------- */
function gen(c){let r=c.seed;const R=()=>(r=(r*1664525+1013904223)>>>0)/4294967296,sp=15000/c.bpm,out=[];let skip=0;
for(let b=1;b<c.bars;b++){const pl=b%8>=3,d=pl?c.d:c.d*.45,ty=R()*4|0,bs=R()*4|0,pr=[[0,3],[1,2],[0,2],[1,3]][R()*4|0],bu=pl&&(d>.95?b%2:d>.6&&b%4==3);let k=0,lp=-1;

const n={t:i*sp,l,p:pl,s:0};

function fromJSON(j){const o=j.song&&typeof j.song=='object'?j.song:j,out=[];
(o.notes||[]).forEach(sc=>(sc.sectionNotes||[]).forEach(a=>{const t=+a[0],d=+a[1];if(!(d>=0)||isNaN(t))return;let p=!!sc.mustHitSection;if(d>3)p=!p;out.push({t,l:d%4,p,s:Math.max(0,+a[2]||0)})}));

/* ---------- audio ---------- */
function ac(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();M=AC.createGain();M.gain.value=.55;const c=AC.createDynamicsCompressor();M.connect(c);c.connect(AC.destination);NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}return AC}

if(s%2==0)nz(t,s%4==2?.07:.03,.1,7000);else if(hd)nz(t,.02,.05,8000);

/* ---------- gameplay ---------- */

if(S.cust)custBuf.forEach(b=>{const s=AC.createBufferSource();s.buffer=b;s.connect(M);s.start(T0);srcs.push(s)});
sc=cb=mx=0;hp=1;ht=[0,0,0,0,0];pT=oT=0;pos=-3000;sm=null;state='play';$('m').className='h'}

/* ---------- input ---------- */

songs.map((s,i)=>`<button class="${i==sel?'s':''}" onclick="start(${i})">${s.n}<br><small>${s.bpm} BPM · ${s.lv}</small></button>`).join('')+
